[project]
name = "architecture-quality-visualization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
